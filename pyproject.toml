[project]
name = "security-scanner"
version = "0.1.0"
description = "AI-powered multi-agent security scanner for detecting security vulnerabilities within a given github codebase"
authors = [
    {name = "yugan243",email = "yugannimsara@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer[all] (>=0.24.0,<0.25.0)",
    "langgraph (>=1.0.8,<2.0.0)",
    "langchain-openai (>=1.1.10,<2.0.0)",
    "langchain-google-genai (>=4.2.0,<5.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "rich (>=14.3.2,<15.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "langchain-groq (>=1.1.2,<2.0.0)",
    "datasets (>=4.5.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false