# ============================================================
# Vigil CI/CD Pipeline
# 
# Triggers:
#   - On push to main: runs tests only
#   - On version tag (v*): runs tests + publishes to PyPI
#
# Usage:
#   git tag v0.2.0
#   git push origin v0.2.0
#   → GitHub automatically publishes to PyPI
# ============================================================

name: CI/CD — Test & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]       # Triggers on tags like v0.1.0, v0.2.0, etc.
  pull_request:
    branches: [main]

jobs:
  # ================================
  # Job 1: Test (runs on every push)
  # ================================
  test:
    name:  Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Install Semgrep
        run: pip install semgrep

      - name: Verify imports work
        run: poetry run python -c "from vigil.config import settings; print(f'Vigil {settings.VERSION} loaded successfully')"

      - name: Verify CLI loads
        run: poetry run vigil --help

  # =============================================
  # Job 2: Publish to PyPI (only on version tags)
  # =============================================
  publish:
    name:  Publish to PyPI
    runs-on: ubuntu-latest
    needs: test                # Only runs if tests pass
    if: startsWith(github.ref, 'refs/tags/v')   # Only on v* tags

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        run: poetry publish
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
